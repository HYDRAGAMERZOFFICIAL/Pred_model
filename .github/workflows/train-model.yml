name: Train NDWI model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        required: true
        default: "50"
        type: string
      mode:
        description: Training strategy
        required: true
        default: both
        type: choice
        options:
          - both
          - full
          - incremental

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository data and source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore persistent archive and active model
        uses: actions/cache@v4
        with:
          path: knowledge_base/
          key: ndwi-knowledgebase-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ndwi-knowledgebase-${{ runner.os }}-

      - name: Audit source rasters and labels
        run: |
          python -m src.dataset_audit --data-dir . --dataset-csv NDWI_pixel_depth_dataset.csv --output dataset_audit_report.json

      - name: Train and validate model candidates
        run: |
          python -m src.trainer --data-dir . --dataset-csv NDWI_pixel_depth_dataset.csv --mode "${{ inputs.mode }}" --patch-size 64 --stride 32 --epochs "${{ inputs.epochs }}" --batch-size 8 --validation-sequences 2

      - name: Upload audit, model versions, and training reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndwi-training-run-${{ github.run_number }}
          path: |
            dataset_audit_report.json
            knowledge_base/
          if-no-files-found: warn
          retention-days: 30
