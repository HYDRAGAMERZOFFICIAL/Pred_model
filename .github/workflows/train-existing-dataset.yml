name: Train existing NDWI CNN U-Net dataset

on:
  workflow_dispatch:
    inputs:
      spectral_dir:
        description: Optional directory with one aligned 4/5-band stack per NDWI scene
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "NDWI_*.tif"
      - "NDWI_*.tiff"
      - "NDWI_pixel_depth_dataset.csv"
      - "training_data/ndwi_monthly/**"
      - "training_data/NDWI_pixel_depth_dataset.csv.gz"
      - "spectral_data/**"
      - "training/TRIGGER_CNN_UNET_TRAINING.txt"

permissions:
  contents: read

concurrency:
  group: ndwi-unet-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main dataset and code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project and geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore persistent knowledge base and model history
        uses: actions/cache@v4
        with:
          path: knowledge_base/
          key: ndwi-cnn-unet-kb-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ndwi-cnn-unet-kb-${{ runner.os }}-

      - name: Select available Jakkur NDWI data
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "training_data/ndwi_monthly" ] && compgen -G "training_data/ndwi_monthly/NDWI_*.tif" > /dev/null; then
            DATA_DIR="training_data/ndwi_monthly"
            if [ -f "training_data/NDWI_pixel_depth_dataset.csv.gz" ]; then
              DATASET_CSV="../NDWI_pixel_depth_dataset.csv.gz"
            elif [ -f "training_data/NDWI_pixel_depth_dataset.csv" ]; then
              DATASET_CSV="../NDWI_pixel_depth_dataset.csv"
            else
              DATASET_CSV="NDWI_pixel_depth_dataset.csv"
            fi
            OUTPUT_DIR="knowledge_base/jakkur_monthly"
          elif [ -d "Jakkur_lake_datasets" ] && compgen -G "Jakkur_lake_datasets/NDWI_*.tif" > /dev/null; then
            DATA_DIR="Jakkur_lake_datasets"
            DATASET_CSV="NDWI_pixel_depth_dataset.csv"
            OUTPUT_DIR="knowledge_base/jakkur"
          elif [ -d "jakkur_lake_datasets" ] && compgen -G "jakkur_lake_datasets/NDWI_*.tif" > /dev/null; then
            DATA_DIR="jakkur_lake_datasets"
            DATASET_CSV="NDWI_pixel_depth_dataset.csv"
            OUTPUT_DIR="knowledge_base/jakkur"
          elif compgen -G "NDWI_*.tif" > /dev/null || compgen -G "NDWI_*.tiff" > /dev/null; then
            DATA_DIR="."
            DATASET_CSV="NDWI_pixel_depth_dataset.csv"
            OUTPUT_DIR="knowledge_base"
          else
            echo "::error title=No NDWI GeoTIFF scenes::The checked-in Jakkur_lake_datasets folder contains QGIS projects and reports, not NDWI GeoTIFF scenes. Export aligned NDWI_*.tif scenes from QGIS and provide the matching pixel-label CSV before training."
            exit 1
          fi

          if [ -f "$DATASET_CSV" ]; then
            echo "DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"
            echo "DATASET_CSV=$DATASET_CSV" >> "$GITHUB_ENV"
            echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"
            echo "Selected NDWI data directory: $DATA_DIR"
            echo "Selected label CSV: $DATASET_CSV"
          else
            echo "::error title=Missing pixel-label CSV::Expected '$DATASET_CSV'. Provide the generated pixel-depth label CSV before supervised CNN U-Net training."
            exit 1
          fi

      - name: Compile project
        run: python -m compileall -q app.py src tests

      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v

      - name: Audit the committed NDWI images, CSV labels and optional multispectral stacks
        env:
          SPECTRAL_DIR: ${{ inputs.spectral_dir }}
        run: |
          if [ -z "$SPECTRAL_DIR" ] && [ -d "spectral_data" ]; then SPECTRAL_DIR="spectral_data"; fi
          if [ -n "$SPECTRAL_DIR" ]; then
            python -m src.dataset_audit --data-dir "$DATA_DIR" --dataset-csv "$DATASET_CSV" --spectral-dir "$SPECTRAL_DIR" --output dataset_audit_report.json
          else
            python -m src.dataset_audit --data-dir "$DATA_DIR" --dataset-csv "$DATASET_CSV" --output dataset_audit_report.json
          fi

      - name: Build append-only knowledge base from the committed dataset
        env:
          SPECTRAL_DIR: ${{ inputs.spectral_dir }}
        run: |
          if [ -z "$SPECTRAL_DIR" ] && [ -d "spectral_data" ]; then SPECTRAL_DIR="spectral_data"; fi
          if [ -n "$SPECTRAL_DIR" ]; then
            python -m src.knowledge_base --data-dir "$DATA_DIR" --dataset-csv "$DATASET_CSV" --archive-dir "$OUTPUT_DIR" --spectral-dir "$SPECTRAL_DIR"
          else
            python -m src.knowledge_base --data-dir "$DATA_DIR" --dataset-csv "$DATASET_CSV" --archive-dir "$OUTPUT_DIR"
          fi

      - name: Train temporal CNN U-Net from CSV-supervised scenes
        env:
          SPECTRAL_DIR: ${{ inputs.spectral_dir }}
        run: |
          if [ -z "$SPECTRAL_DIR" ] && [ -d "spectral_data" ]; then SPECTRAL_DIR="spectral_data"; fi
          if [ -n "$SPECTRAL_DIR" ]; then
            python -m src.trainer --data-dir "$DATA_DIR" --dataset-csv "$DATASET_CSV" --output-dir "$OUTPUT_DIR" --mode both --patch-size 64 --stride 32 --epochs 50 --batch-size 8 --validation-sequences 2 --min-valid-fraction 0.01 --spectral-dir "$SPECTRAL_DIR" --skip-ingest
          else
            python -m src.trainer --data-dir "$DATA_DIR" --dataset-csv "$DATASET_CSV" --output-dir "$OUTPUT_DIR" --mode full --patch-size 64 --stride 32 --epochs 50 --batch-size 8 --validation-sequences 2 --min-valid-fraction 0.01 --skip-ingest
          fi

      - name: Record source revision and dataset counts
        run: |
          python - <<'PY'
          import json
          import os
          import pandas as pd
          import rasterio
          from pathlib import Path
          data_dir = Path(os.environ.get("DATA_DIR", "."))
          csv_path = os.environ.get("DATASET_CSV", "NDWI_pixel_depth_dataset.csv")
          output_dir = Path(os.environ.get("OUTPUT_DIR", "knowledge_base"))
          scenes = sorted(data_dir.glob("NDWI_*.tif"))
          labels = pd.read_csv(data_dir / csv_path)
          metadata = {
              "git_commit": os.environ["GITHUB_SHA"],
              "source_scene_count": len(scenes),
              "csv_label_rows": int(len(labels)),
              "csv_scenes": int(labels["image"].nunique()),
              "labels_per_scene": labels.groupby("image").size().to_dict(),
              "csv_columns": list(labels.columns),
              "training_report": "knowledge_base/runs/<run-id>/full_retrain/training_report.json",
              "run_summary": "knowledge_base/runs/<run-id>/run_summary.json",
          }
          output_dir.mkdir(parents=True, exist_ok=True)
          with open(output_dir / "dataset_build_summary.json", "w") as f:
              json.dump(metadata, f, indent=2)
          print(json.dumps(metadata, indent=2))
          PY

      - name: Upload knowledge base and trained model candidates
        uses: actions/upload-artifact@v4
        with:
          name: ndwi-cnn-unet-knowledge-base-${{ github.run_number }}
          path: |
            knowledge_base/
            dataset_audit_report.json
          if-no-files-found: error
          retention-days: 30
