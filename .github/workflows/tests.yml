name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy rasterio pyproj scikit-image scipy
      - name: Run geospatial unit tests
        run: python -m unittest tests.test_data_processor -v
