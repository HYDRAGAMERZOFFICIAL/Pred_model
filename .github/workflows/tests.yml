name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib rasterio pyproj scikit-image scipy "tensorflow>=2.15"
      - name: Compile Python modules
        run: python -m compileall -q app.py src tests
      - name: Audit local NDWI scenes and pixel labels when supplied
        run: |
          if [ -d "training_data/ndwi_monthly" ] && compgen -G "training_data/ndwi_monthly/NDWI_*.tif" > /dev/null; then
            python -m src.dataset_audit --data-dir training_data/ndwi_monthly --dataset-csv ../NDWI_pixel_depth_dataset.csv.gz --output dataset_audit_report.json
          elif compgen -G "NDWI_*.tif" > /dev/null || compgen -G "NDWI_*.tiff" > /dev/null; then
            python -m src.dataset_audit --data-dir . --dataset-csv NDWI_pixel_depth_dataset.csv --output dataset_audit_report.json
          else
            echo "No NDWI GeoTIFF inputs are present in the repository; dataset audit is covered by synthetic unit tests."
          fi
      - name: Run geospatial and temporal unit tests
        run: |
          python -m unittest discover -s tests -p 'test_data_processor.py' -v
          python -m unittest discover -s tests -p 'test_temporal_learning.py' -v
          python -m unittest discover -s tests -p 'test_knowledge_base.py' -v
          python -m unittest discover -s tests -p 'test_predictor.py' -v
          python -m unittest discover -s tests -p 'test_dataset_audit.py' -v
          python -m unittest discover -s tests -p 'test_lake_boundary.py' -v
          python -m unittest discover -s tests -p 'test_forecasting.py' -v
          python -m unittest discover -s tests -p 'test_spectrum_to_ndwi.py' -v
